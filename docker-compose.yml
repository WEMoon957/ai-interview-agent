# 本地一键起：postgres + api
# 使用前先 `cp .env.example .env` 并填入真实 LLM_API_KEY
services:
  postgres:
    image: postgres:16
    container_name: interview-agent-postgres
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # 依赖在镜像构建阶段安装（见 backend/Dockerfile）；启动只做迁移 + 起服务，
    # 不再每次重装依赖 → 部署/重启从 3 分钟降到数秒
    build:
      context: ./backend
    container_name: interview-agent-api
    working_dir: /app
    volumes:
      # 代码仍用 bind mount（本地改代码即时生效）；挂载的是 /app，不影响镜像里已装的依赖
      - ./backend:/app
    env_file:
      # .env：项目通用配置；.env.local：仅存于服务器的敏感凭据（飞书 App Secret 等），已被 .gitignore 忽略
      - .env
      - path: .env.local
        required: false
    environment:
      # 容器内通过服务名访问 postgres，覆盖 .env 中的 localhost
      DATABASE_URL: postgresql://interview:interview@postgres:5432/interview
      # 国内 pip 镜像加速（构建期已由 Dockerfile 设置，此处保留兜底）
      PIP_INDEX_URL: "https://mirrors.cloud.tencent.com/pypi/simple/"
      PIP_TRUSTED_HOST: "mirrors.cloud.tencent.com"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
    container_name: interview-agent-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
