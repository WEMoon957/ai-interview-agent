name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    # 测试套件里有一部分用例**直接使用真实数据库**（如 test_auth_guard 要查会话表、
    # offer/公司文化相关用例要查快照表），因此 CI 必须提供 Postgres 并跑完迁移，
    # 否则这些用例会以 psycopg.OperationalError（connection refused）失败。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Prepare database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://interview:interview@localhost:5432/interview
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          LLM_API_KEY: dummy-ci-key
          DATABASE_URL: postgresql://interview:interview@localhost:5432/interview
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci

      - name: Build
        run: npm run build
