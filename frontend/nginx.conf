server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 面试录音等大文件上传：默认 1m 会让店长传音频直接 413
    client_max_body_size 100m;

    # ── 安全响应头 ─────────────────────────────────────────────
    # ⚠️ nginx 的 add_header 是"覆盖"而非"叠加"：只要某个 location 里
    # 再写一条 add_header，本层的全部配置就会被那个 location 整体顶掉。
    # 新增 location 时请不要随意添加 add_header。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP：前端是 Vite 构建产物，脚本均为外链文件；style 必须放开 inline，
    # 因为 Element Plus 会注入内联样式。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # HSTS 需在确认全站 HTTPS 后启用，否则会把 HTTP 访问锁死，先留注释：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台登录鉴权：会话 Cookie 必须同源，故与前端共用同一域名
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 审计与登录限流依赖真实客户端 IP，必须还原原始转发链
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反向代理后端 API（含录音上传/下载，故放宽超时与 body 限制）
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /interview/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Offer 候选人确认页（/o/{token}）的数据接口
    location /offer/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
